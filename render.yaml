# One-click deploy blueprint for Render (https://render.com).
# In Render: New > Blueprint > connect this repo. It reads this file.
#
# Free plan note: the free tier has ephemeral storage (data resets on
# redeploy/restart), so central storage lasts through the review window and
# the emailed summary on submit is the permanent record. To keep a permanent
# on-server archive, upgrade the service and add a disk mounted at /var/data
# with DATA_DIR=/var/data.
services:
  - type: web
    name: hhg-social-approval
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NOTIFY_EMAIL
        value: youraistarr@gmail.com
      - key: ADMIN_KEY
        generateValue: true      # Render generates a secret; view it in the dashboard
      # Set these in the Render dashboard to enable email notifications:
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
